<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set your password — North Shore Youth Music</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  .accept-wrap { max-width: 420px; margin: 80px auto; padding: 0 20px; }
  .accept-card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 32px; }
  .accept-card h1 { font-family: var(--display); font-size: 1.5rem; margin: 0 0 8px; }
  .accept-card p { color: var(--ink-soft); font-size: 0.95rem; margin: 0 0 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold-deep); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px;
    font-family: var(--body); font-size: 15px; box-sizing: border-box;
  }
  #msg { font-family: var(--mono); font-size: 13px; margin-top: 14px; }
  #msg.error { color: #b3261e; }
  #msg.success { color: var(--stringalongs-green); }
</style>
</head>
<body>

<div class="accept-wrap">
  <div class="accept-card">
    <img src="images/logo-dark.png" alt="North Shore Youth Music" style="height:40px; margin-bottom:24px;">
    <h1 id="heading">Set your password</h1>
    <p id="subheading">Choose a password to finish setting up your admin account.</p>

    <form id="accept-form">
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input type="password" id="password2" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-gold">Set password &amp; continue</button>
      <div id="msg"></div>
    </form>
  </div>
</div>

<script>
function getTokenFromHash() {
  const hash = location.hash.replace(/^#/, '');
  const params = new URLSearchParams(hash);
  const invite = params.get('invite_token');
  const recovery = params.get('recovery_token');
  if (invite) return { type: 'signup', token: invite };
  if (recovery) return { type: 'recovery', token: recovery };
  return null;
}

function saveSession(data) {
  const expires_at = Date.now() + (data.expires_in * 1000) - 60000;
  localStorage.setItem('nsym_admin_session', JSON.stringify({
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: expires_at
  }));
}

const info = getTokenFromHash();
const msg = document.getElementById('msg');

if (!info) {
  document.getElementById('heading').textContent = 'Link not recognized';
  document.getElementById('subheading').textContent = "This doesn't look like a valid invite or password-reset link. Ask Carl to send a fresh one.";
  document.getElementById('accept-form').style.display = 'none';
} else if (info.type === 'recovery') {
  document.getElementById('subheading').textContent = 'Choose a new password for your admin account.';
}

document.getElementById('accept-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;
  msg.className = '';
  if (p1 !== p2) {
    msg.textContent = "Passwords don't match.";
    msg.className = 'error';
    return;
  }
  msg.textContent = 'Setting your password…';
  try {
    const res = await fetch('/.netlify/identity/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: info.type, token: info.token, password: p1 })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error_description || err.msg || ('Request failed (' + res.status + ')'));
    }
    const data = await res.json();
    saveSession(data);
    msg.textContent = 'Success — taking you to the admin page…';
    msg.className = 'success';
    setTimeout(() => { location.href = 'admin.html'; }, 900);
  } catch (err) {
    msg.textContent = 'Error: ' + err.message;
    msg.className = 'error';
  }
});
</script>
</body>
</html>
